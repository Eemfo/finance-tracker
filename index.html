<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {

  --bg-card: #1C1C1E; --bg-card-hover: #2C2C2E; --bg-elevated: #2C2C2E;

html { color-scheme: dark; }
body {

.logo-mark { width: 26px; height: 26px; color: var(--accent); flex-shrink: 0; }

};
function getExpenseColor(name) { return EXPENSE_COLORS[name] || '#8E8E93'; }

// ==================== API через Supabase ====================
async function loadAll(showToast = true) {
  try {
    setSync(true);
    const [txRes, crRes, payRes] = await Promise.all([
      sb.from('transactions').select('*').order('date', { ascending: false }),
      sb.from('credits').select('*').order('priority', { ascending: true }),
      sb.from('payments').select('*').order('date', { ascending: false })
    ]);

    if (txRes.error) throw new Error('transactions: ' + txRes.error.message);
    if (crRes.error) throw new Error('credits: ' + crRes.error.message);
    if (payRes.error) throw new Error('payments: ' + payRes.error.message);

    state.transactions = txRes.data || [];
    state.credits = crRes.data || [];
    state.payments = payRes.data || [];

    recomputeSummary();
    try { localStorage.setItem(CONFIG.DISPLAY_CACHE, JSON.stringify({ transactions: state.transactions, credits: state.credits, payments: state.payments })); } catch (e) {}
    state.chartsDirty = true;
    renderAll();
    if (showToast) toast('Обновлено');
  } catch (e) {
    console.error(e);
    if (showToast) toast('Ошибка: ' + e.message, true);
  } finally { setSync(false); }
}

function loadFromCache() {
  try {
    const c = localStorage.getItem(CONFIG.DISPLAY_CACHE);
    if (!c) return false;
    const db = JSON.parse(c);
    state.transactions = db.transactions || [];
    state.credits = db.credits || [];
    state.payments = db.payments || [];
    recomputeSummary();
    state.chartsDirty = true;
    renderAll();
    return true;
  } catch (e) { return false; }
}

function recomputeSummary() { const r = monthRange(state.viewMonth); state.summary = buildSummary(state.transactions, r.from, r.to); }
function renderAll() { renderBalance(); renderMonthTitle(); renderDashboard(); renderHistory(); renderCredits(); }
function setSync(on) { document.getElementById('syncBtn').classList.toggle('syncing', on); }
function showLoading(text) { document.getElementById('loadingText').textContent = text || 'Загрузка…'; document.getElementById('loadingOverlay').classList.add('open'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('open'); }
function setButtonLoading(btn, loading, text) {
  if (!btn) return;
  if (loading) { btn.dataset.originalText = btn.textContent; btn.textContent = text || 'Сохранение…'; btn.disabled = true; }
  else { btn.textContent = btn.dataset.originalText || 'Сохранить'; btn.disabled = false; }
}

function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function formatMoney(n) { return (Number(n) || 0).toLocaleString('ru-RU') + ' ₽'; }
function formatDate(str) { if (!str) return ''; const d = new Date(str + 'T00:00:00'); return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); }
function formatDateLong(str) { if (!str) return ''; const d = new Date(str + 'T00:00:00'); return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }); }
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('error', isError);
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

function renderBalance() {
  let totalIncome = 0, totalExpense = 0;
  state.transactions.forEach(t => {
    const amt = Number(t.amount) || 0;
    if (t.type === 'income') totalIncome += amt; else totalExpense += amt;
  });
  const balance = totalIncome - totalExpense;
  document.getElementById('totalBalance').textContent = formatMoney(balance);
  document.getElementById('balanceCard').classList.toggle('negative', balance < 0);
  document.getElementById('balanceSub').textContent = 'Доходы ' + formatMoney(totalIncome) + ' · Расходы ' + formatMoney(totalExpense);
}

function renderMonthTitle() {
  const t = document.getElementById('monthTitle');

let chartMain = null;
function renderCharts(s) {
  const byCat = s.by_category || {};
  const expenseCats = Object.entries(byCat).filter(([_,v]) => v.expense > 0).sort((a,b) => b[1].expense - a[1].expense);
  const hasExpense = expenseCats.length > 0;
  const labels = hasExpense ? expenseCats.map(([k]) => k) : ['Нет расходов'];
  const data = hasExpense ? expenseCats.map(([_,v]) => v.expense) : [1];
  const colors = hasExpense ? expenseCats.map(([k]) => getExpenseColor(k)) : ['#2C2C2E'];

  const cfg = {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 4, hoverBorderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 400 },
      layout: { padding: 8 }, cutout: '68%',
      plugins: {
        legend: { display: false },
        tooltip: {
          position: 'nearest', caretPadding: 8, caretSize: 4,
          yAlign: 'bottom', xAlign: 'center',
          backgroundColor: 'rgba(28,28,30,0.98)',
          borderColor: 'rgba(94,140,191,0.4)', borderWidth: 1,
          titleColor: '#FFFFFF', titleFont: { size: 12, weight: '600' },
          titleMarginBottom: 4,
          bodyColor: '#8E8E93', bodyFont: { size: 11, weight: '500' }, bodySpacing: 3,
          padding: { top: 8, bottom: 8, left: 10, right: 10 },
          cornerRadius: 8, displayColors: true, boxWidth: 8, boxHeight: 8, boxPadding: 3,
          callbacks: { label: (ctx) => { const v = ctx.parsed < 0.01 ? 0 : ctx.parsed; return '  ' + v.toLocaleString('ru-RU') + ' ₽'; } }
        }
      }
    }
  };

  const canvas = document.getElementById('chartMain');
  if (!canvas) return;
  if (chartMain) { chartMain.destroy(); chartMain = null; }
  chartMain = new Chart(canvas, cfg);

  const center = document.getElementById('chartCenter');
  if (hasExpense) center.innerHTML = `${formatMoney(s.expense || 0)}<small>расход</small>`;
  else center.innerHTML = `—<small>нет данных</small>`;

  const legend = document.getElementById('chartLegend');
  const items = expenseCats.map(([k, v]) =>
    `<div class="legend-item"><span class="legend-dot" style="background:${getExpenseColor(k)}"></span>${k} · ${formatMoney(v.expense)}</div>`
  );
  legend.innerHTML = items.length ? items.join('') : '';
  renderRatio(s);
}

function renderRatio(s) {
  const income = s.income || 0, expense = s.expense || 0;
  const balance = income - expense, total = income + expense;
  const iB = document.getElementById('ratioIncomeBar'), eB = document.getElementById('ratioExpenseBar');
  const p = document.getElementById('ratioPercent'), iE = document.getElementById('ratioIncome');
  const eE = document.getElementById('ratioExpense'), bE = document.getElementById('ratioBalance');

  if (total === 0) {
    iB.style.width = '0%'; eB.style.width = '0%';
    p.textContent = 'Нет данных за этот месяц';
    iE.textContent = '0 ₽'; eE.textContent = '0 ₽'; bE.textContent = '0 ₽';
    return;
  }
  iB.style.width = ((income / total) * 100).toFixed(1) + '%';
  eB.style.width = ((expense / total) * 100).toFixed(1) + '%';
  p.innerHTML = income > 0
    ? `Расходы составляют <strong>${((expense/income)*100).toFixed(0)}%</strong> от доходов`
    : `Доходов в этом месяце нет`;
  iE.textContent = formatMoney(income);
  eE.textContent = formatMoney(expense);
  bE.textContent = (balance >= 0 ? '+' : '') + formatMoney(balance);
  bE.classList.remove('green', 'red', 'accent');
  if (balance > 0) bE.classList.add('green');
  else if (balance < 0) bE.classList.add('red');
  else bE.classList.add('accent');
}

function renderBlocks(s) {
  const list = document.getElementById('blockList');
  const byCat = s.by_category || {};
  const totals = Object.entries(byCat).filter(([_,v]) => v.expense > 0).sort((a,b) => b[1].expense - a[1].expense);
  if (!totals.length) { list.innerHTML = '<div class="block-empty">Нет расходов за этот месяц</div>'; return; }
  const max = Math.max(1, ...totals.map(([_,v]) => v.expense));
  list.innerHTML = totals.map(([name, v]) => `
    <div class="block-item" data-cat="${name}">
      <div class="block-row">
        <span class="block-name">${name}</span>
        <span class="block-amount">${formatMoney(v.expense)}</span>
      </div>
      <div class="block-bar"><div class="block-bar-fill" style="width:${(v.expense/max*100).toFixed(1)}%;background:${getExpenseColor(name)}"></div></div>
    </div>
  `).join('');
  list.querySelectorAll('.block-item').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      document.getElementById('filterCategory').value = el.dataset.cat;
      state.histMonth = { ...state.viewMonth }; saveHistMonth();
      switchView('history'); renderHistory(); renderMonthTitle();
    };
  });
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const cat  = document.getElementById('filterCategory').value;
  const type = document.getElementById('filterType').value;
  const range = monthRange(state.histMonth);

  let items = state.transactions.filter(t => t.date >= range.from && t.date <= range.to);
  if (cat) items = items.filter(t => t.category === cat);
  if (type) items = items.filter(t => t.type === type);
  items.sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  if (!items.length) { list.innerHTML = '<div class="block-empty">Нет операций за этот месяц</div>'; return; }

  const groups = {};
  items.forEach(t => { (groups[t.date] = groups[t.date] || []).push(t); });
  list.innerHTML = Object.entries(groups).map(([date, txs]) => {
    const dI = txs.filter(t => t.type==='income').reduce((s,t) => s + Number(t.amount), 0);
    const dE = txs.filter(t => t.type==='expense').reduce((s,t) => s + Number(t.amount), 0);
    return `
      <div class="history-date-group">
        <span>${formatDate(date)}</span>
        ${dI ? `<span style="color:var(--income)">+${formatMoney(dI)}</span>` : ''}
        ${dE ? `<span style="color:var(--expense)">−${formatMoney(dE)}</span>` : ''}
      </div>
      ${txs.map(t => `
        <div class="history-item" data-id="${t.id}">
          <div class="history-info">
            <div class="history-cat">${t.category}${t.subcategory?' · '+t.subcategory:''}</div>
            ${t.note?`<div class="history-note">${t.note}</div>`:''}
          </div>
          <div class="history-amount ${t.type}">${t.type==='income'?'+':'−'}${formatMoney(t.amount)}</div>
        </div>
      `).join('')}
    `;
  }).join('');
  list.querySelectorAll('.history-item').forEach(el => {
    el.onclick = () => {
      const t = state.transactions.find(x => x.id === el.dataset.id);
      if (t) openDetailModal(t);
    };
  });
}

function renderCredits() {
  const sum  = document.getElementById('creditsSummary');
  const list = document.getElementById('creditsList');
  const credits = [...state.credits].sort((a,b) => (a.priority||99) - (b.priority||99));

  if (!credits.length) {
    sum.innerHTML = '<h4>Общий долг</h4><div class="big">0 ₽</div>';
    list.innerHTML = '<div class="block-empty">Нет кредитов</div>';
    document.getElementById('debtTotal').textContent = '—';
    document.getElementById('debtFill').style.width = '0%';
    return;
  }

  const total = credits.reduce((s,c) => s + Number(c.current_debt||0), 0);
  const monthly = credits.reduce((s,c) => s + Number(c.monthly_payment||0), 0);
  const initial = credits.reduce((s,c) => s + Number(c.total||0), 0);
  const paid = initial - total;

  sum.innerHTML = `
    <h4>Общий долг</h4>
    <div class="big">${formatMoney(total)}</div>
    <div class="sub">Выплачено ${formatMoney(paid)} · Мин. платёж ${formatMoney(monthly)}/мес</div>
  `;
  document.getElementById('debtTotal').innerHTML = `<strong>${formatMoney(total)}</strong> из ${formatMoney(initial)}`;
  const pct = initial > 0 ? (1 - total/initial) * 100 : 0;
  document.getElementById('debtFill').style.width = pct.toFixed(1) + '%';
  const badge = document.getElementById('snowballBadge');
  if (badge) badge.textContent = pct.toFixed(0) + '%';

  const targetId = credits.find(c => Number(c.current_debt) > 0)?.id;
  const openCards = loadOpenCards();

  list.innerHTML = credits.map(c => {
    const isTarget = String(c.id) === String(targetId);
    const isClosed = Number(c.current_debt) === 0;
    const progress = c.total > 0 ? (1 - c.current_debt/c.total)*100 : 0;
    const isOpen = openCards[c.id] === true;
    const creditPayments = state.payments.filter(p => String(p.credit_id) === String(c.id)).sort((a,b) => (b.date || '').localeCompare(a.date || ''));
    const totalPaid = creditPayments.reduce((s,p) => s + Number(p.amount), 0);
    const paymentsHTML = creditPayments.length
      ? creditPayments.map(p => `
          <div class="payment-item" data-payment-id="${p.id}">
            <div class="payment-item-left">
              <span class="payment-date">${formatDateLong(p.date)}</span>
              <span class="payment-type ${p.type === 'early' ? 'early' : ''}">${p.type === 'early' ? '⚡ Досрочный' : '• Минимальный'}</span>
            </div>
            <span class="payment-amount">−${formatMoney(p.amount)}</span>
          </div>
        `).join('')
      : '<div class="payments-empty">Платежей ещё не было</div>';

    return `
      <div class="debt-card ${isTarget?'target':''} ${isClosed?'closed':''} ${isOpen?'open':''}" data-id="${c.id}">
        <div class="debt-card-header" data-toggle="card">
          <div class="debt-head">
            <span class="debt-name">${isTarget ? ICONS.target : ''}${c.name} ${ICONS.chevronRight}</span>
            <span class="debt-num">${formatMoney(c.current_debt)}</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${progress.toFixed(1)}%"></div></div>
          <div class="debt-meta">
            <span>Платёж: ${formatMoney(c.monthly_payment)}</span>
            <span>${isClosed ? 'Закрыт' : 'до ' + (c.close_date || '—')}</span>
          </div>
        </div>
        <div class="debt-card-body">
          <div class="debt-card-body-inner">
            <div class="debt-detail-grid">
              <div class="debt-detail-item"><div class="debt-detail-label">Изначально</div><div class="debt-detail-value">${formatMoney(c.total)}</div></div>
              <div class="debt-detail-item"><div class="debt-detail-label">Выплачено</div><div class="debt-detail-value">${formatMoney(totalPaid)}</div></div>
              <div class="debt-detail-item"><div class="debt-detail-label">Осталось</div><div class="debt-detail-value">${formatMoney(c.current_debt)}</div></div>
              <div class="debt-detail-item"><div class="debt-detail-label">Ставка</div><div class="debt-detail-value">${c.rate ? c.rate + '%' : '—'}</div></div>
            </div>
            ${!isClosed ? `
            <div class="debt-actions">
              <button class="debt-action-btn primary" data-action="pay" data-id="${c.id}">${ICONS.plus} Внести</button>
              <button class="debt-action-btn secondary" data-action="early" data-id="${c.id}">${ICONS.bolt} Досрочно</button>
            </div>` : ''}
            <div class="payments-title">История платежей (${creditPayments.length})</div>
            <div class="payments-list">${paymentsHTML}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.debt-card').forEach(card => {
    const id = card.dataset.id;
    const header = card.querySelector('[data-toggle="card"]');
    if (header) header.onclick = (e) => { e.stopPropagation(); card.classList.toggle('open'); saveOpenCard(id, card.classList.contains('open')); };
    card.querySelectorAll('[data-action]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const action = btn.dataset.action;
        const creditId = btn.dataset.id;
        if (action === 'pay') openPaymentModal(creditId, 'min', null);
        else if (action === 'early') openPaymentModal(creditId, 'early', null);
      };
    });
    card.querySelectorAll('[data-payment-id]').forEach(pEl => {
      pEl.onclick = (e) => {
        e.stopPropagation();
        const payment = state.payments.find(p => p.id === pEl.dataset.paymentId);
        if (payment) openPaymentModal(payment.credit_id, payment.type, payment);
      };
    });
  });
}

// ==================== PAYMENT MODAL ====================
function openPaymentModal(creditId, type = 'min', editPayment = null) {
  const c = state.credits.find(x => String(x.id) === String(creditId));
  if (!c) return;
  const isEdit = !!editPayment;
  document.getElementById('paymentTitle').textContent = isEdit ? 'Редактировать платёж' : 'Платёж · ' + c.name;
  document.getElementById('payCreditId').value = creditId;
  document.getElementById('payEditId').value = isEdit ? editPayment.id : '';
  document.getElementById('btnPayDelete').style.display = isEdit ? 'block' : 'none';
  document.getElementById('btnPayCancel').style.display = isEdit ? 'block' : 'none';

  if (isEdit) {
    document.getElementById('payAmount').value = editPayment.amount;
    document.getElementById('payDate').value = editPayment.date;
    setPayType(editPayment.type || 'min');
  } else {
    document.getElementById('payAmount').value = type === 'early' ? '' : (c.monthly_payment || '');
    document.getElementById('payDate').value = today();
    setPayType(type);
  }
  document.getElementById('payCurrentDebt').textContent = formatMoney(c.current_debt);
  document.getElementById('payMonthly').textContent = formatMoney(c.monthly_payment);
  updatePayAfter();
  document.getElementById('payAmount').oninput = updatePayAfter;
  document.getElementById('modalPayment').classList.add('open');
}

function setPayType(type) {
  document.getElementById('payType').value = type;
  document.querySelectorAll('#payTypeSegmented button').forEach(b => {
    b.classList.toggle('active', b.dataset.paytype === type);
  });
}
function updatePayAfter() {
  const creditId = document.getElementById('payCreditId').value;
  const editId = document.getElementById('payEditId').value;
  const c = state.credits.find(x => String(x.id) === String(creditId));
  if (!c) return;
  const amount = Number(document.getElementById('payAmount').value) || 0;
  let baseDebt = Number(c.current_debt);
  if (editId) { const oldP = state.payments.find(p => p.id === editId); if (oldP) baseDebt += Number(oldP.amount); }
  document.getElementById('payAfter').textContent = formatMoney(Math.max(0, baseDebt - amount));
}
document.querySelectorAll('#payTypeSegmented button').forEach(b => {
  b.addEventListener('click', () => {
    setPayType(b.dataset.paytype);
    const editId = document.getElementById('payEditId').value;
    if (editId) return;
    if (b.dataset.paytype === 'early') document.getElementById('payAmount').value = '';
    else {
      const creditId = document.getElementById('payCreditId').value;
      const c = state.credits.find(x => String(x.id) === String(creditId));
      if (c) document.getElementById('payAmount').value = c.monthly_payment || '';
    }
    updatePayAfter();
  });
});

document.getElementById('formPayment').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (state.saving) return;
  state.saving = true;
  const btn = document.getElementById('btnSavePayment');
  const creditId = document.getElementById('payCreditId').value;
  const editId = document.getElementById('payEditId').value;
  const amount = Number(document.getElementById('payAmount').value);
  const date = document.getElementById('payDate').value;
  const type = document.getElementById('payType').value;
  if (!amount || amount <= 0) { toast('Введи сумму', true); state.saving = false; return; }

  setButtonLoading(btn, true, 'Сохранение…');
  showLoading('Сохранение платежа…');

  try {
    const c = state.credits.find(x => String(x.id) === String(creditId));
    if (!c) throw new Error('Кредит не найден');

    if (editId) {
      const oldP = state.payments.find(p => p.id === editId);
      const { error: payErr } = await sb.from('payments').update({ amount, date, type }).eq('id', editId);
      if (payErr) throw payErr;
      const baseDebt = Number(c.current_debt) + Number(oldP?.amount || 0);
      const newDebt = Math.max(0, baseDebt - amount);
      const { error: credErr } = await sb.from('credits').update({ current_debt: newDebt, status: newDebt === 0 ? 'closed' : 'active' }).eq('id', creditId);
      if (credErr) throw credErr;
      const idx = state.payments.findIndex(p => p.id === editId);
      if (idx >= 0) state.payments[idx] = { ...state.payments[idx], amount, date, type };
      c.current_debt = newDebt;
      c.status = newDebt === 0 ? 'closed' : 'active';
      toast('Платёж обновлён');
    } else {
      const newDebt = Math.max(0, Number(c.current_debt) - amount);
      const { data: payData, error: payErr } = await sb.from('payments').insert({ credit_id: creditId, date, amount, type, new_debt: newDebt }).select().single();
      if (payErr) throw payErr;
      const { error: credErr } = await sb.from('credits').update({ current_debt: newDebt, status: newDebt === 0 ? 'closed' : 'active' }).eq('id', creditId);
      if (credErr) throw credErr;
      await sb.from('transactions').insert({
        date, type: 'expense', category: 'Кредиты',
        subcategory: 'Кредит ' + creditId, amount,
        account: 'Карта', is_impulse: false,
        note: type === 'early' ? 'Досрочный платёж' : 'Платёж по кредиту'
      });
      state.payments.push(payData);
      c.current_debt = newDebt;
      state.transactions.push({
        id: 'tmp_' + Date.now(), date, type: 'expense', category: 'Кредиты',
        subcategory: 'Кредит ' + creditId, amount, account: 'Карта', is_impulse: false,
        note: type === 'early' ? 'Досрочный платёж' : 'Платёж по кредиту'
      });
      toast(type === 'early' ? 'Досрочный платёж внесён' : 'Платёж внесён');
    }

    document.getElementById('modalPayment').classList.remove('open');
    recomputeSummary(); state.chartsDirty = true; renderAll();
  } catch (err) { toast('Ошибка: ' + err.message, true); }
  finally { state.saving = false; setButtonLoading(btn, false); hideLoading(); }
});

document.getElementById('btnPayDelete').addEventListener('click', async () => {
  if (state.saving) return;
  const editId = document.getElementById('payEditId').value;
  if (!editId || !confirm('Удалить платёж? Долг восстановится.')) return;
  const btn = document.getElementById('btnPayDelete');
  state.saving = true;
  setButtonLoading(btn, true, 'Удаление…');
  showLoading('Удаление…');
  try {
    const p = state.payments.find(x => x.id === editId);
    if (p) {
      const c = state.credits.find(x => String(x.id) === String(p.credit_id));
      if (c) {
        const newDebt = Number(c.current_debt) + Number(p.amount);
        const { error: credErr } = await sb.from('credits').update({ current_debt: newDebt, status: newDebt === 0 ? 'closed' : 'active' }).eq('id', p.credit_id);
        if (credErr) throw credErr;
        c.current_debt = newDebt;
        c.status = newDebt === 0 ? 'closed' : 'active';
      }
    }
    const { error } = await sb.from('payments').delete().eq('id', editId);
    if (error) throw error;
    state.payments = state.payments.filter(x => x.id !== editId);
    document.getElementById('modalPayment').classList.remove('open');
    toast('Платёж удалён');
    recomputeSummary(); state.chartsDirty = true; renderAll();
  } catch (err) { toast('Ошибка: ' + err.message, true); }
  finally { state.saving = false; setButtonLoading(btn, false); hideLoading(); }
});

document.getElementById('closePayment').onclick = () => document.getElementById('modalPayment').classList.remove('open');
document.getElementById('btnPayCancel').onclick = () => document.getElementById('modalPayment').classList.remove('open');

// ==================== TRANSACTION MODAL ====================
function openAddModal(category, type) {
  document.getElementById('modalTitle').textContent = 'Новая операция';
  document.getElementById('editId').value = '';
  document.getElementById('btnDelete').style.display = 'none';
  setType(type || 'expense');
  document.getElementById('fDate').value = today();
  document.getElementById('fAmount').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('fImpulse').checked = false;
  document.getElementById('fAccount').value = 'Карта';
  if (category) document.getElementById('fCategory').value = category;
  updateSubcats();
  document.getElementById('modalAdd').classList.add('open');
}

function openDetailModal(t) {
  document.getElementById('modalTitle').textContent = 'Операция';
  document.getElementById('editId').value = t.id;
  document.getElementById('btnDelete').style.display = 'block';
  setType(t.type);
  document.getElementById('fDate').value = t.date;
  document.getElementById('fAmount').value = t.amount;
  document.getElementById('fNote').value = t.note || '';
  document.getElementById('fImpulse').checked = t.is_impulse === true || String(t.is_impulse) === 'true';
  document.getElementById('fCategory').value = t.category;
  updateSubcats();
  document.getElementById('fSubcategory').value = t.subcategory || '';
  document.getElementById('fAccount').value = t.account || 'Карта';
  document.getElementById('modalAdd').classList.add('open');
}

function setType(type) {
  document.getElementById('fType').value = type;
  document.querySelectorAll('#typeSegmented button').forEach(b => {
    b.classList.toggle('active', b.dataset.type === type);
  });
  const catSel = document.getElementById('fCategory');
  catSel.innerHTML = '<option value="">— выбери —</option>' +
    Object.keys(CATEGORIES[type]).map(c => `<option value="${c}">${c}</option>`).join('');
}
function updateSubcats() {
  const type = document.getElementById('fType').value;
  const cat  = document.getElementById('fCategory').value;
  const subSel = document.getElementById('fSubcategory');
  const subs = (CATEGORIES[type] && CATEGORIES[type][cat]) || [];
  subSel.innerHTML = '<option value="">—</option>' + subs.map(s => `<option value="${s}">${s}</option>`).join('');
}
document.getElementById('fCategory').addEventListener('change', updateSubcats);
document.querySelectorAll('#typeSegmented button').forEach(b => {
  b.addEventListener('click', () => { setType(b.dataset.type); updateSubcats(); });
});

document.getElementById('formAdd').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (state.saving) return;
  const btn = document.getElementById('btnSaveTransaction');
  const id = document.getElementById('editId').value;
  const data = {
    date:        document.getElementById('fDate').value,
    type:        document.getElementById('fType').value,
    category:    document.getElementById('fCategory').value,
    subcategory: document.getElementById('fSubcategory').value,
    amount:      Number(document.getElementById('fAmount').value),
    account:     document.getElementById('fAccount').value,
    note:        document.getElementById('fNote').value,
    is_impulse:  document.getElementById('fImpulse').checked
  };
  if (!data.category) { toast('Выбери категорию', true); return; }
  if (!data.amount || data.amount <= 0) { toast('Введи сумму', true); return; }

  state.saving = true;
  setButtonLoading(btn, true, 'Сохранение…');
  showLoading(id ? 'Обновление…' : 'Сохранение…');

  try {
    if (id) {
      const { error } = await sb.from('transactions').update(data).eq('id', id);
      if (error) throw error;
      const idx = state.transactions.findIndex(t => t.id === id);
      if (idx >= 0) state.transactions[idx] = { ...state.transactions[idx], ...data };
      toast('Обновлено');
    } else {
      const { data: created, error } = await sb.from('transactions').insert(data).select().single();
      if (error) throw error;
      state.transactions.push(created);
      toast('Сохранено');
    }
    document.getElementById('modalAdd').classList.remove('open');
    recomputeSummary(); state.chartsDirty = true; renderAll();
  } catch (err) { toast('Ошибка: ' + err.message, true); }
  finally { state.saving = false; setButtonLoading(btn, false); hideLoading(); }
});

document.getElementById('btnDelete').addEventListener('click', async () => {
  if (state.saving) return;
  const id = document.getElementById('editId').value;
  if (!id || !confirm('Удалить операцию?')) return;
  const btn = document.getElementById('btnDelete');
  state.saving = true;
  setButtonLoading(btn, true, 'Удаление…');
  showLoading('Удаление…');
  try {
    const { error } = await sb.from('transactions').delete().eq('id', id);
    if (error) throw error;
    state.transactions = state.transactions.filter(t => t.id !== id);
    document.getElementById('modalAdd').classList.remove('open');
    toast('Удалено');
    recomputeSummary(); state.chartsDirty = true; renderAll();
  } catch (err) { toast('Ошибка: ' + err.message, true); }
  finally { state.saving = false; setButtonLoading(btn, false); hideLoading(); }
});

document.getElementById('closeModal').onclick = () => document.getElementById('modalAdd').classList.remove('open');
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

function switchView(view) {
  state.view = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (view === 'dashboard' && state.chartsDirty) {
    setTimeout(() => {
      const chartsSection = document.querySelector('.section[data-section="charts"]');
      if (!chartsSection || !chartsSection.classList.contains('collapsed')) {
        renderCharts(state.summary);
        state.chartsDirty = false;
      }
    }, 60);
  }
}
document.querySelectorAll('.bottom-nav button').forEach(b => {
  b.onclick = () => switchView(b.dataset.view);
});
document.getElementById('fabAdd').onclick = () => openAddModal();
['filterCategory','filterType'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderHistory);
});
document.getElementById('syncBtn').onclick = () => loadAll(true);

function buildSummary(transactions, from, to) {
  const items = transactions.filter(t => t.date >= from && t.date <= to);
  const byCat = {};
  let income = 0, expense = 0;
  items.forEach(t => {
    const amt = Number(t.amount) || 0;
    if (t.type === 'income') income += amt; else expense += amt;
    if (!byCat[t.category]) byCat[t.category] = { income: 0, expense: 0 };
    if (t.type === 'income') byCat[t.category].income += amt;
    else byCat[t.category].expense += amt;
  });
  return { from, to, income, expense, balance: income - expense, by_category: byCat };
}

// ==================== СТАРТ ====================
document.getElementById('filterCategory').innerHTML =
  '<option value="">Все категории</option>' +
  [...Object.keys(CATEGORIES.expense), ...Object.keys(CATEGORIES.income)]
    .map(c => `<option value="${c}">${c}</option>`).join('');

initCollapsibleSections();
const hadCache = loadFromCache();
loadAll(!hadCache);

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.view === 'dashboard' && state.summary) {
      const chartsSection = document.querySelector('.section[data-section="charts"]');
      if (!chartsSection || !chartsSection.classList.contains('collapsed')) {
        renderCharts(state.summary);
      }
    }
  }, 200);
});
</script>
